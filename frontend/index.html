<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#26c7b4" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Testify — Shiftech Test Manager</title>
    <script>
      (function () {
        var stored = localStorage.getItem("theme-mode.v1");
        var mode = stored === "light" || stored === "dark" ? stored : null;
        var dark = mode
          ? mode === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        var link = document.createElement("link");
        link.id = "prime-theme";
        link.rel = "stylesheet";
        link.href = dark
          ? "/app/prime-themes/lara-dark-teal/theme.css"
          : "/app/prime-themes/lara-light-teal/theme.css";
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
